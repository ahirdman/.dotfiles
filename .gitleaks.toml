title = "dotfiles"

[extend]
useDefault = true

[[rules]]
id = "tailnet-name"
description = "Tailscale MagicDNS name"
regex = '''[a-z0-9-]+\.ts\.net'''

[[rules]]
id = "private-ipv4"
description = "Private or Tailscale IPv4 address"
regex = '''\b(192\.168\.\d{1,3}\.\d{1,3}|10\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}|100\.(6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.\d{1,3}\.\d{1,3})\b'''

[[rules]]
id = "azure-ai-host"
description = "Azure AI resource hostname"
regex = '''[a-z0-9-]+\.(openai\.azure\.com|services\.ai\.azure\.com|cognitiveservices\.azure\.com)'''
